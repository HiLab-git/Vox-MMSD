[dataset]
tensor_type = float
task_type = seg
train_dir  = /home/BraTS_PED/data/preprocessed_data
valid_dir  = /home/BraTS_PED/data/preprocessed_data
test_dir  = /home/BraTS_PED/data/preprocessed_data
train_csv = data/train.csv
valid_csv = data/valid.csv
test_csv  = data/test.csv
modal_num = 4
train_batch_size = 2
train_transform = [RandomFlip, RandomCrop, NormalizeWithMinMax, GaussianNoise, GammaCorrection, LabelToProbability]
valid_transform = [NormalizeWithMinMax, LabelToProbability]
test_transform  = [NormalizeWithMinMax]
RandomCrop_output_size = [96, 96, 96]
GammaCorrection_channels  = [0,1,2,3]
GammaCorrection_gamma_min = 0.7
GammaCorrection_gamma_max = 1.5
GammaCorrection_probability = 0.8
GaussianNoise_channels = [0,1,2,3]
GaussianNoise_mean     = 0
GaussianNoise_std      = 0.05
GaussianNoise_probability = 1
RandomFlip_flip_depth = False
RandomFlip_flip_height = False
RandomFlip_flip_width = True

[network]
net_type = UNet3D
class_num  = 4
in_chns       = 4
feature_chns  = [32, 64, 128, 256, 512]
dropout       = [0, 0, 0.2, 0.3, 0.4]
up_mode       = 2
multiscale_pred = True

[training]
gpus = [0]
mixup_probability = 0.5
loss_type     = [DiceLoss, CrossEntropyLoss]
loss_weight   = [1.0, 1.0]
deep_supervise = True
optimizer     = Adam
learning_rate = 2e-4
momentum      = 0.9
weight_decay  = 1e-4
lr_scheduler  = CosineAnnealingLR
ckpt_save_dir    = model/baseline
iter_start = 0
iter_max   = 10000
iter_valid = 100
iter_save  = 10000

[testing]
gpus = [0]
ckpt_mode  = 1
output_dir  = result/baseline
sliding_window_enable = True
sliding_window_size   = [96, 96, 96]
sliding_window_stride = [96, 96, 96]
